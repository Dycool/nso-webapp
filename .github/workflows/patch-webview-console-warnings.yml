name: Apply WebView console warning fixes

on:
  push:
    paths:
      - '.github/workflows/patch-webview-console-warnings.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch WebView lifecycle and image loading
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1. Do not keep a sandboxed about:blank iframe in the DOM. The manager
          # creates it only after the Worker URL exists, preventing Chromium from
          # evaluating allow-scripts + allow-same-origin against inherited about:blank.
          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index, count = re.subn(
              r'\n\s*<!-- allow-same-origin is required:.*?-->\s*\n\s*<iframe\s+id="inAppGameWebviewFrame".*?</iframe>',
              '',
              index,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not remove the static game-service iframe safely')
          index_path.write_text(index, encoding='utf-8')

          manager_path = Path('services/manager.js')
          manager = manager_path.read_text(encoding='utf-8')

          anchor = '''    escapeText(value) {
                  const div = document.createElement('div');
                  div.textContent = String(value ?? '');
                  return div.innerHTML;
              }
          '''
          methods = '''    escapeText(value) {
                  const div = document.createElement('div');
                  div.textContent = String(value ?? '');
                  return div.innerHTML;
              }

              destroyServiceFrame() {
                  const frame = document.getElementById('inAppGameWebviewFrame');
                  if (!frame) return;
                  try { frame.remove(); } catch (e) { frame.parentNode?.removeChild(frame); }
              }

              mountServiceFrame(service, src) {
                  const wrap = document.querySelector('.inapp-webview-frame-wrap');
                  if (!wrap || !src) return null;

                  this.destroyServiceFrame();

                  // Configure the complete cross-origin WebView while detached, then
                  // navigate it directly to the Worker before insertion. This avoids a
                  // sandboxed inherited about:blank document and its Chromium warning.
                  const frame = document.createElement('iframe');
                  frame.id = 'inAppGameWebviewFrame';
                  frame.name = 'inAppGameWebviewFrame';
                  frame.title = 'Nintendo Switch Online Game Service';
                  frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads');

                  // Zelda Notes uses the Screen Wake Lock API while its map is open.
                  // Delegate only that capability to Zelda's Worker-origin document.
                  if (this.getAdapter(service) === this.zeldaNotesAdapter) {
                      frame.setAttribute('allow', 'screen-wake-lock');
                  }

                  frame.src = String(src);
                  wrap.appendChild(frame);
                  return frame;
              }
          '''
          if anchor not in manager:
              raise SystemExit('manager.js escapeText anchor not found')
          manager = manager.replace(anchor, methods, 1)

          old_begin = '''        const overlay = document.getElementById('inAppGameWebview');
                  const title = document.getElementById('inAppGameWebviewTitle');
                  const frame = document.getElementById('inAppGameWebviewFrame');
                  if (title) title.textContent = service?.name || nsoUiText('Game Service');
                  if (frame) frame.src = 'about:blank';
                  this.ensureLoadingSurface(service);
          '''
          new_begin = '''        const overlay = document.getElementById('inAppGameWebview');
                  const title = document.getElementById('inAppGameWebviewTitle');
                  if (title) title.textContent = service?.name || nsoUiText('Game Service');
                  this.destroyServiceFrame();
                  this.ensureLoadingSurface(service);
          '''
          if old_begin not in manager:
              raise SystemExit('manager.js beginNativeServiceLaunch block not found')
          manager = manager.replace(old_begin, new_begin, 1)

          # Failed/cancelled launches must also remove any already-mounted Worker frame.
          cancel_anchor = '''        const overlay = document.getElementById('inAppGameWebview');
                  const surfaces = this.getLaunchBackgroundSurfaces();
          '''
          cancel_replacement = '''        const overlay = document.getElementById('inAppGameWebview');
                  const surfaces = this.getLaunchBackgroundSurfaces();
                  this.destroyServiceFrame();
          '''
          cancel_pos = manager.find('    async cancelNativeServiceLaunch()')
          if cancel_pos < 0:
              raise SystemExit('cancelNativeServiceLaunch not found')
          section_end = manager.find('    /**\n     * Launch a selected game service.', cancel_pos)
          section = manager[cancel_pos:section_end]
          if cancel_anchor not in section:
              raise SystemExit('cancelNativeServiceLaunch overlay anchor not found')
          section = section.replace(cancel_anchor, cancel_replacement, 1)
          manager = manager[:cancel_pos] + section + manager[section_end:]

          old_close = '''        const overlay = document.getElementById('inAppGameWebview');
                  const frame = document.getElementById('inAppGameWebviewFrame');
                  const surfaces = this.getLaunchBackgroundSurfaces();

                  // about:blank is set at the instant Back is pressed so the browser cancels
                  // the Nintendo document/subresource waterfall instead of continuing it behind
                  // the 400 ms APK-style back animation.
                  if (frame) frame.src = 'about:blank';
                  document.getElementById('gwsNativeLoading')?.classList.add('hidden');
          '''
          new_close = '''        const overlay = document.getElementById('inAppGameWebview');
                  const surfaces = this.getLaunchBackgroundSurfaces();

                  // Removing the frame cancels the Nintendo document/subresource waterfall
                  // immediately without navigating through inherited about:blank.
                  this.destroyServiceFrame();
                  document.getElementById('gwsNativeLoading')?.classList.add('hidden');
          '''
          if old_close not in manager:
              raise SystemExit('manager.js closeActiveService iframe teardown block not found')
          manager = manager.replace(old_close, new_close, 1)
          manager_path.write_text(manager, encoding='utf-8')

          adapters_path = Path('services/adapters.js')
          adapters = adapters_path.read_text(encoding='utf-8')
          old_launch = '''        const title = document.getElementById('inAppGameWebviewTitle');
                  const frame = document.getElementById('inAppGameWebviewFrame');

                  if (title) title.textContent = service.name || 'Game Service';
                  if (frame) frame.src = sessionData.webviewUrl;
          '''
          new_launch = '''        const title = document.getElementById('inAppGameWebviewTitle');

                  if (title) title.textContent = service.name || 'Game Service';
                  this.manager.mountServiceFrame(service, sessionData.webviewUrl);
          '''
          if old_launch not in adapters:
              raise SystemExit('adapters.js launch block not found')
          adapters = adapters.replace(old_launch, new_launch, 1)

          adapters, removed = re.subn(
              r'\n\s*// Zelda Notes keeps the display awake while its interactive map is open\..*?\n\s*return super\.launch\(service, token, options\);',
              '\n\n        return super.launch(service, token, options);',
              adapters,
              count=1,
              flags=re.S,
          )
          if removed != 1:
              raise SystemExit('Could not remove obsolete Zelda iframe permission block')
          adapters_path.write_text(adapters, encoding='utf-8')

          # Explicit lazy-loading is what causes Edge's intervention messages in the
          # app-owned play-log/album grids. These are already bounded lists, so eager
          # loading is a small and predictable cost and avoids deferred load events.
          native_path = Path('js/native.js')
          native = native_path.read_text(encoding='utf-8')
          if "image.loading = 'lazy';" not in native:
              raise SystemExit('Expected native play-log lazy image was not found')
          native_path.write_text(native.replace("image.loading = 'lazy';", "image.loading = 'eager';", 1), encoding='utf-8')

          album_path = Path('js/album.js')
          album = album_path.read_text(encoding='utf-8')
          if 'loading="lazy"' not in album:
              raise SystemExit('Expected album lazy image was not found')
          album_path.write_text(album.replace('loading="lazy"', 'loading="eager"'), encoding='utf-8')

          Path('.github/workflows/patch-webview-console-warnings.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services/manager.js services/adapters.js js/native.js js/album.js .github/workflows/patch-webview-console-warnings.yml
          git commit -m "Clean up WebView browser warnings"
          git push
