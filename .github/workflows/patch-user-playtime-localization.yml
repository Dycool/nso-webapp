name: Apply user playtime localization patch

on:
  push:
    paths:
      - '.github/workflows/patch-user-playtime-localization.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch native user playtime formatter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('js/native.js')
          source = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"(?ms)^[ \t]*function ownPlayTimeText\(totalPlayTime\) \{\n"
              r"[ \t]*const minutes = Number\(totalPlayTime \|\| 0\);\n"
              r"[ \t]*if \(!Number\.isFinite\(minutes\) \|\| minutes < 60\) return 'Played for a little while';\n"
              r"[ \t]*const hours = Math\.max\(1, Math\.round\(minutes / 60\)\);\n"
              r"[ \t]*return `Played for \$\{hours\} hour\(s\) or more`;\n"
              r"[ \t]*\}"
          )
          replacement = "\n".join([
              "    function ownPlayTimeText(totalPlayTime) {",
              "        const minutes = Number(totalPlayTime || 0);",
              "        if (!Number.isFinite(minutes) || minutes < 60) {",
              "            return trKey('FriendDetails_Label_Play_Log_Little');",
              "        }",
              "        const hours = Math.max(1, Math.round(minutes / 60));",
              "        return trFormat('FriendDetails_Label_Play_Log_Time', hours);",
              "    }",
          ])
          updated, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'Expected one ownPlayTimeText implementation, found {count}; refusing to modify native.js')

          path.write_text(updated, encoding='utf-8')
          Path('.github/workflows/patch-user-playtime-localization.yml').unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/native.js .github/workflows/patch-user-playtime-localization.yml
          git commit -m "Fix user playtime localization"
          git push
